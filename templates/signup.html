<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | NiDi</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}" />
</head>
<body>

{% include "navbar.html" %}

<main class="page">
  <div class="signup-card">

    <div class="icon-header">⚖️</div>
    <h1>Welcome to NiDi</h1>
    <p class="subtitle">
      Your AI-powered legal assistant.
      Sign in to access BNS, BSA, and legal analytics.
    </p>

    <a href="/auth/google" class="google-btn-link">
      <button class="google-btn">
        <img
          src="https://developers.google.com/identity/images/g-logo.png"
          alt="Google logo"
        />
        <span>Continue with Google</span>
      </button>
    </a>

    <p class="auth-note">
      Secure access via Google. No password required.
    </p>

    <div class="divider"></div>

    <p class="legal-note">
      By continuing, you agree to our <a href="/disclaimer">Disclaimer</a> & <a href="/privacy">Privacy Policy</a>.
    </p>

  </div>
</main>

</body>
</html>
