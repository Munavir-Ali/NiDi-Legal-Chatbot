<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat | NIDI LawBot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='botinterface.css') }}" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .nav-avatar {
      width: 30px;
      border-radius: 50%;
      margin-left: 10px;
      vertical-align: middle;
      border: 1px solid #64CCC5;
    }
  </style>
</head>
<body>
  {% include 'navbar.html' %}
  <main class="chat-wrapper">
    <div class="chat-box" id="chat-box">
      <div class="message-row left">
        <div class="avatar bot">🤖</div>
        <div class="message">
          Hello! I am NiDi. Which Section or Article can I help you with today?
        </div>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendMessage()">➤</button>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');
        if (hamburger && navMenu) {
            hamburger.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }
    });

    function appendMessage(role, content) {
        const chatBox = document.getElementById('chat-box');
        const side = role === 'user' ? 'right' : 'left';
        const avatar = role === 'user' ? '👤' : '🤖';
        const avatarClass = role === 'user' ? 'user' : 'bot';

        const msgHtml = `
            <div class="message-row ${side}">
                ${role === 'left' || role === 'bot' ? `<div class="avatar ${avatarClass}">${avatar}</div>` : ''}
                <div class="message">${content}</div>
                ${role === 'user' ? `<div class="avatar ${avatarClass}">${avatar}</div>` : ''}
            </div>
        `;
        chatBox.insertAdjacentHTML('beforeend', msgHtml);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const message = input.value.trim();
        if (!message) return;

        appendMessage("user", message);
        input.value = '';

        const needsLocation = /police|station|help|emergency|danger/i.test(message);

        if (needsLocation && navigator.geolocation) {
            appendMessage("bot", "Locating you for accuracy... 📡");

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                await sendToRasa(message, coords);
            }, (err) => {
                console.error(err);
                sendToRasa(message, null);
            }, { timeout: 10000 });
        } else {
            await sendToRasa(message, null);
        }
    }

    async function sendToRasa(message, coords) {
        try {
            const payload = { sender: "user", message: message, metadata: {} };
            if (coords) { payload.metadata = { location: coords }; }

            // Use the proxy route on your Flask server instead of direct IP
            const response = await fetch('/rasa_proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            data.forEach(res => {
                if (res.text) appendMessage("bot", res.text);
                if (res.custom && res.custom.type === "station_list") {
                    let listHtml = '<div class="station-list-container">';
                    res.custom.data.forEach(station => {
                        listHtml += `
                            <div class="station-card">
                                <strong>📍 ${station.name}</strong>
                                <p>📏 Distance: ${station.distance} km</p>
                                <p>🏠 ${station.address}</p>
                                <p>📞 ${station.phone}</p>
                                <button class="nav-btn" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${station.lat},${station.lon}')">Navigate</button>
                            </div>`;
                    });
                    listHtml += '</div>';
                    appendMessage("bot", listHtml);
                }
            });
        } catch (error) {
            appendMessage("bot", "Connection error with the legal brain.");
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') { sendMessage(); }
    }
  </script>
{% include 'footer.html' %}
</body>
</html>
