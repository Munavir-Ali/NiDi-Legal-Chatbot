<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat | NIDI LawBot</title>
  <link rel="stylesheet" href="static/botinterface.css" />
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="{{ url_for('home') }}" class="logo">⚖️ NiDi</a>

      <div class="hamburger" id="hamburger">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>

      <nav class="nav-links" id="nav-menu">
        <a href="/about">About</a>
        <a href="/login">Login</a>
        <a href="/signup">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="chat-wrapper">
    <div class="chat-box" id="chat-box">
      <div class="message-row left">
        <div class="avatar bot">🤖</div>
        <div class="message">
          Hello! I am NiDi. Which Section or Article can I help you with today?
        </div>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendMessage()">➤</button>
    </div>
  </main>

  <script>
    // Navigation Toggle
    document.addEventListener('DOMContentLoaded', () => {
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');
        if (hamburger && navMenu) {
            hamburger.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }
    });

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const message = input.value.trim();

        if (!message) return;

        chatBox.innerHTML += `
            <div class="message-row right">
                <div class="message">${message}</div>
                <div class="avatar user">👤</div>
            </div>
        `;

        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('http://10.195.17.130:5005/webhooks/rest/webhook', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: "user", message: message })
            });

            const data = await response.json();

            data.forEach(res => {
                chatBox.innerHTML += `
                    <div class="message-row left">
                        <div class="avatar bot">🤖</div>
                        <div class="message">${res.text}</div>
                    </div>
                `;
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            console.error("Error:", error);
            chatBox.innerHTML += `
                <div class="message-row left">
                    <div class="avatar bot">🤖</div>
                    <div class="message">Sorry, I'm having trouble connecting to the server.</div>
                </div>
            `;
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
  </script>

</body>
</html>
