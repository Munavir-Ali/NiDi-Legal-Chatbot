<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat | NIDI LawBot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='botinterface.css') }}" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  {% include 'navbar.html' %}
  <main class="chat-wrapper">
    <div class="chat-box" id="chat-box">
      <div class="message-row left"><div class="message">Hello! I am NiDi. How can I assist you with legal matters today?</div></div>
    </div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type message/സന്ദേശം നൽകുക/अपना संदेश टाइप करें..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendMessage()">➤</button>
    </div>
  </main>
  <script>
    window.onload = async function() {
        try {
            await fetch('/rasa_proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: "user", message: "/restart" })
            });
        } catch (e) {
            console.log("Restart failed");
        }
    };

    function appendMessage(role, content) {
        const chatBox = document.getElementById('chat-box');
        const side = role === 'user' ? 'right' : 'left';
        const msgHtml = `<div class="message-row ${side}"><div class="message">${content}</div></div>`;
        chatBox.insertAdjacentHTML('beforeend', msgHtml);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const message = input.value.trim();
        if (!message) return;
        appendMessage("user", message);
        input.value = '';
        const needsLoc = /police|station|help|emergency|പോലീസ്|സ്റ്റേഷൻ|पुलिस|थाना/i.test(message);
        if (needsLoc && navigator.geolocation) {
            appendMessage("bot", "Accessing location... 📡");
            navigator.geolocation.getCurrentPosition(pos => sendToRasa(message, { lat: pos.coords.latitude, lon: pos.coords.longitude }), () => sendToRasa(message, null));
        } else { sendToRasa(message, null); }
    }

    async function sendToRasa(message, coords) {
        try {
            const response = await fetch('/rasa_proxy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sender: "user", message: message, metadata: { session_metadata: { location: coords } } }) });
            const data = await response.json();
            data.forEach(res => {
                if (res.text) appendMessage("bot", res.text);
                const custom = res.custom || res.json_message;
                if (custom && custom.type === "station_list") {
                    let html = '<div class="station-list-container">';
                    custom.data.forEach(s => { html += `<div class="station-card"><strong>📍 ${s.name}</strong><p>📏 ${s.distance} km</p><p>📞 ${s.phone}</p><button class="nav-btn" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}')">Navigate</button></div>`; });
                    appendMessage("bot", html + '</div>');
                }
                if (custom && custom.type === "complaint_draft") {
                    const d = custom.data;
                    const previewText = d.body;
                    const mailtoLink = `https://mail.google.com/mail/?view=cm&fs=1&to=&su=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.body)}`;
                    appendMessage("bot", `<div class="complaint-preview"><p><strong>Formal Draft Preview:</strong></p><pre>${previewText}</pre><button class="nav-btn" onclick="window.open('${mailtoLink}', '_blank')">📧 Open in Gmail</button></div>`);
                }
            });
        } catch (e) { appendMessage("bot", "Connection error."); }
    }
    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
  </script>
</body>
</html>
