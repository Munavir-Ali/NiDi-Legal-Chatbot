<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiDi</title>
  <link rel="stylesheet" href="/static/index.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.3.min.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="{{ url_for('home') }}" class="logo">⚖️ NiDi</a>

      <div class="hamburger" id="hamburger">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>

      <nav class="nav-links" id="nav-menu">
        <a href="/about">About</a>
        <a href="/login">Login</a>
        <a href="/signup">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="stats-carousel">
        <div class="carousel-wrapper">
            <div class="arrow" onclick="changeChart(-1)">◀</div>
            <div id="chart"></div>
            <div class="arrow" onclick="changeChart(1)">▶</div>
        </div>
    </section>

    <section class="hero">
      <h1>Your Legal Assistant, Powered by AI.</h1>
      <p>Get instant legal guidance and information.</p>
      <button class="cta-btn" onclick="window.location.href='/chat'">
        Start Chat
      </button>
    </section>

    <section class="features">
        <div class="feature-card">
            <div class="icon">⚖️</div>
            <h3>Legal Advice</h3>
            <hr />
            <p>Get answers to your legal questions.</p>
        </div>
        <div class="feature-card">
            <div class="icon">🛡️</div>
            <h3>Confidential & Secure</h3>
            <hr />
            <p>Your privacy is our priority.</p>
        </div>
        <div class="feature-card">
            <div class="icon">⏰</div>
            <h3>Available 24/7</h3>
            <hr />
            <p>Help anytime, anywhere.</p>
        </div>
    </section>
  </main>

  <script>
    var allCharts = {{ all_graphs | tojson | safe }};
    var currentIndex = 0;

    function renderCurrentChart() {
        if (allCharts.length > 0) {
            var currentGraph = allCharts[currentIndex];
            // Applying the palette to Plotly layout
            var layout = {
                ...currentGraph.layout,
                paper_bgcolor: '#DAFFFB',
                plot_bgcolor: '#DAFFFB',
                font: { color: '#001C30' },
                margin: { t: 40, b: 40, l: 40, r: 40 }
            };
            Plotly.newPlot('chart', currentGraph.data, layout, {
                responsive: true,
                displayModeBar: false
            });
        }
    }

    function changeChart(direction) {
        currentIndex = (currentIndex + direction + allCharts.length) % allCharts.length;
        renderCurrentChart();
    }

    window.onload = renderCurrentChart;

    document.addEventListener('DOMContentLoaded', () => {
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');
        if (hamburger && navMenu) {
            hamburger.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }
    });
  </script>
</body>
</html>
