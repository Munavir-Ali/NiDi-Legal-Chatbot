<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NiDi Interface</title>
    <script src="https://cdn.plot.ly/plotly-2.35.3.min.js" charset="utf-8"></script>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #070F2B; height: 100vh; display: flex; flex-direction: column; color: white; }

        .navbar { background-color: #070F2B; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #1B1A55; }
        .nav-icon { font-size: 24px; cursor: pointer; color: white; }
        .logo { font-size: 32px; font-weight: bold; letter-spacing: 2px; color: white; }

        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 30px; }

        .carousel-wrapper { display: flex; align-items: center; width: 80%; gap: 20px; justify-content: center; }
        .arrow { font-size: 50px; color: #9290C3; cursor: pointer; user-select: none; transition: 0.3s; }
        .arrow:hover { color: white; }

        .stats-container { flex: 1; height: 420px; background-color: #1B1A55; border-radius: 12px; padding: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid #535C91; }

        .chat-container { width: 90%; height: 200px; background-color: #070F2B; border-radius: 12px; padding: 25px; border: 2px solid #1B1A55; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }

        .chat-bubble { display: flex; align-items: center; gap: 15px; font-size: 16px; color: #9290C3; }
        .dot { height: 12px; width: 12px; background-color: #535C91; border-radius: 50%; }

        #chart { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-icon">☰</div>
        <div class="logo">NiDi</div>
        <div class="nav-icon">👤</div>
    </div>

    <div class="main-content">
        <div class="carousel-wrapper">
            <div class="arrow" onclick="changeChart(-1)">◀</div>
            <div class="stats-container">
                <div id="chart"></div>
            </div>
            <div class="arrow" onclick="changeChart(1)">▶</div>
        </div>

        <div class="chat-container">
            <div id="chat-window" style="height: 120px; overflow-y: auto; margin-bottom: 10px;">
                <div class="chat-bubble">
                    <span class="dot"></span>
                    <span id="bot-response">Hi, how can I help you?</span>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="user-input" placeholder="Ask NiDi about crime stats..." style="flex: 1; background: #1B1A55; border: 1px solid #535C91; color: white; border-radius: 8px; padding: 10px;">
                <button onclick="sendMessage()" style="background: #9290C3; border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer;">Send</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Receives the list of 11 charts from Flask
        var allCharts = {{ all_graphs | tojson | safe }};
        var currentIndex = 0;

        function renderCurrentChart() {
            var currentGraph = allCharts[currentIndex];

            // Render specific graph based on currentIndex
            Plotly.newPlot(
                'chart',
                currentGraph.data,
                currentGraph.layout,
                { responsive: true, displayModeBar: false }
            );
        }

        function changeChart(direction) {
            // 2. Circular Queue Logic: index loops back to start/end
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = allCharts.length - 1;
            } else if (currentIndex >= allCharts.length) {
                currentIndex = 0;
            }

            renderCurrentChart();
        }

        // Initial render on page load
        if (allCharts.length > 0) {
            renderCurrentChart();
        } else {
            document.getElementById('chart').innerHTML = "<p style='text-align:center; padding-top:150px;'>No data available.</p>";
        }

        async function sendMessage() {
    const input = document.getElementById('user-input');
    const chatWindow = document.getElementById('chat-window');
    const message = input.value;
    if (!message) return;

    // 1. Show user message in chat
    chatWindow.innerHTML += `<div class='chat-bubble' style='justify-content: flex-end;'><span style='color: white;'>${message}</span></div>`;
    input.value = '';

    // 2. Send to Rasa
    try {
        const response = await fetch('http://localhost:5005/webhooks/rest/webhook', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: "user1", message: message })
        });
        const data = await response.json();

        // 3. Show Rasa's response
        data.forEach(res => {
            chatWindow.innerHTML += `<div class='chat-bubble'><span class='dot'></span><span>${res.text}</span></div>`;
        });
        chatWindow.scrollTop = chatWindow.scrollHeight; // Auto-scroll
    } catch (error) {
        console.error("Rasa Error:", error);
    }
}
    </script>

</body>
</html>
