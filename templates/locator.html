<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NiDi | Emergency Locator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 60vh; width: 100%; border-radius: 12px; border: 3px solid #64CCC5; margin-top: 20px; }
    .station-list { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
    .station-card { background: white; padding: 15px; border-radius: 8px; border-left: 5px solid #e63946; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="{{ url_for('home') }}" class="logo">⚖️ NiDi</a>
      <nav class="nav-links">
        <a href="/about">About</a>
        {% if current_user.is_authenticated %}
          <a href="/chat">Chat</a>
          <a href="/logout">Logout</a>
          <img src="{{ current_user.picture }}" class="nav-avatar" style="width:30px; border-radius:50%; vertical-align:middle;">
        {% else %}
          <a href="/signin">Sign In</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="main" style="padding: 20px;">
    <h2 style="color: #001C30; text-align: center;">Nearest Police Stations</h2>
    <div id="map"></div>
    <div id="station-results" class="station-list"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map = L.map('map').setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        map.setView([lat, lon], 14);
        L.marker([lat, lon]).addTo(map).bindPopup("Your Location").openPopup();

        fetch(`/get_nearby_stations?lat=${lat}&lon=${lon}`)
          .then(r => r.json())
          .then(data => {
            const list = document.getElementById('station-results');
            data.elements.forEach(el => {
              const marker = L.marker([el.lat, el.lon]).addTo(map);
              const name = el.tags.name || "Police Station";
              marker.bindPopup(`<b>${name}</b>`);

              const card = document.createElement('div');
              card.className = 'station-card';
              card.innerHTML = `
                <h4>${name}</h4>
                <button class="cta-btn" style="padding: 8px 15px; font-size: 14px; margin-top:10px;"
                        onclick="window.open('https://www.google.com/maps?q=${el.lat},${el.lon}')">Navigate</button>`;
              list.appendChild(card);
            });
          });
      });
    }
  </script>
</body>
</html>
