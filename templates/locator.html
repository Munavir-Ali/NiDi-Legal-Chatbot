<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NiDi | Emergency Locator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='locator.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  {% include 'navbar.html' %}
  <main class="main-content">
    <h2 class="page-title">Police Station Finder</h2>

    <div id="map-container">
      <div id="map"></div>
      <button class="locate-btn" onclick="locateMe()" title="Recenter Location">🎯</button>
    </div>

    <div id="status-message" class="loader">Searching for your location... 📡</div>
    <div id="station-results" class="station-list"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map = L.map('map').setView([10.018, 76.353], 13);
    let userMarker, stationMarkers = [];
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

    document.getElementById('hamburger').addEventListener('click', function() {
        document.getElementById('nav-menu').classList.toggle('active');
    });

    function locateMe() {
      document.getElementById('status-message').style.display = 'block';
      document.getElementById('status-message').innerText = "Acquiring GPS Signal... 📡";
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude: lat, longitude: lon } = pos.coords;
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker([lat, lon]).addTo(map).bindPopup("<b>You are here</b>").openPopup();
          map.setView([lat, lon], 15);
          fetchStations(lat, lon);
        }, err => {
          document.getElementById('status-message').innerText = "Location access denied. Please enable GPS.";
        }, { enableHighAccuracy: true, timeout: 8000 });
      }
    }

    function fetchStations(lat, lon) {
      document.getElementById('status-message').innerText = "Finding nearest stations... 🔍";
      fetch(`/get_nearby_stations?lat=${lat}&lon=${lon}`)
        .then(r => r.json())
        .then(data => {
          const list = document.getElementById('station-results');
          list.innerHTML = "";
          stationMarkers.forEach(m => map.removeLayer(m));
          stationMarkers = [];
          const elements = data.elements || [];
          document.getElementById('status-message').style.display = 'none';

          if (elements.length === 0) {
            list.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>No stations found within 10km.</p>";
            return;
          }

          elements.forEach(el => {
            const s_lat = el.lat || (el.center ? el.center.lat : null);
            const s_lon = el.lon || (el.center ? el.center.lon : null);
            if (!s_lat || !s_lon) return;

            const tags = el.tags || {};
            const name = tags.name || "Police Station";
            const distance = el.distance;
            const address = tags['addr:street'] ? `${tags['addr:street']}, ${tags['addr:suburb'] || ''}` : "Address not provided";
            const phone = tags['phone'] || tags['contact:phone'] || tags['mobile'] || "Not available";

            const marker = L.marker([s_lat, s_lon]).addTo(map);
            marker.bindPopup(`<b>${name}</b><br>Distance: ${distance} km`);
            stationMarkers.push(marker);

            const card = document.createElement('div');
            card.className = 'station-card';
            card.innerHTML = `
                <div>
                    <h4>📍 ${name}</h4>
                    <p><strong>📏 Distance:</strong> ${distance} km</p>
                    <p><strong>🏠 Address:</strong> ${address}</p>
                    <p><strong>📞 Contact:</strong> ${phone !== "Not available" ? `<a href="tel:${phone}">${phone}</a>` : phone}</p>
                </div>
                <button class="nav-button" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${s_lat},${s_lon}')">
                    Navigate
                </button>`;
            list.appendChild(card);
          });
        })
        .catch(err => { document.getElementById('status-message').innerText = "Error connecting to server."; });
    }
    window.onload = locateMe;
  </script>
{% include 'footer.html' %}
</body>
</html>
