<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | NIDI LawBot</title>
  <link rel="stylesheet" href="static/admin_login.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="{{ url_for('home') }}" class="logo" style="text-decoration: none;">⚖️NiDi</a>
    </div>
  </header>

  <!-- PAGE -->
  <main class="page">

    <div class="admin-card">

      <h1>Admin Login</h1>
      <p class="subtitle">Sign in to access the admin dashboard.</p>

      <form>

        <label>Email Address</label>
        <div class="input-group">
          <span class="icon">✉️</span>
          <input type="email" placeholder="Enter your email" required />
        </div>

        <label>Password</label>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input type="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn">Login</button>

      </form>

      <a href="#" class="back-link">Back to User Login</a>

    </div>

  </main>

</body>
</html>
