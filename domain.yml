version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - bot_challenge
  - ask_legal_info
  - find_police
  - mood_great      # Added missing intent
  - mood_unhappy    # Added missing intent

entities:
  - legal_section
  - session_metadata

slots:
  legal_section:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: legal_section

  session_metadata:
    type: any
    mappings:
      - type: from_entity
        entity: session_metadata

responses:
  utter_greet:
    - text: "Hello! I am NiDi. Which Section or Article can I help you with today?"

  utter_ask_legal_section:
    - text: "I've noted you are asking about a legal provision. Let me fetch that for you."

  utter_goodbye:
    - text: "Goodbye! Stay legally informed."

  utter_iamabot:
    - text: "I am NiDi, a legal information bot. Please note: I cannot provide pure legal advice like a lawyer; I can only help you find and understand existing legal sections and articles."

  utter_happy:
    - text: "Great, carry on!"

  utter_cheer_up:
    - text: "Here is something to cheer you up:"
      image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
    - text: "Did that help you?"

actions:
  - action_get_legal_description # Registered your custom action
  - action_find_nearby_police

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

