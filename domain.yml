version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - bot_challenge
  - ask_legal_info
  - find_police
  - mood_great
  - mood_unhappy
  - request_complaint

entities:
  - legal_section
  - session_metadata
  - incident_type
  - incident_details
  - incident_location

slots:
  legal_section:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: legal_section

  session_metadata:
    type: any
    mappings:
      - type: from_entity
        entity: session_metadata

  incident_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: incident_type
      - type: from_text
        conditions:
          - active_loop: complaint_form
            requested_slot: incident_type

  incident_details:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: complaint_form
            requested_slot: incident_details

  incident_location:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: incident_location
      - type: from_text
        conditions:
          - active_loop: complaint_form
            requested_slot: incident_location

responses:
  utter_happy:
    - text: "Great, carry on!"

  utter_cheer_up:
    - text: "Here is something to cheer you up:"
      image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
    - text: "Did that help you?"

  utter_greet:
    - text: "Hello! I am NiDi. Which Section or Article can I help you with today?"

  utter_ask_legal_section:
    - text: "I've noted you are asking about a legal provision. Let me fetch that for you."

  utter_goodbye:
    - text: "Goodbye! Stay legally informed."

  utter_iamabot:
    - text: "I am NiDi, a legal information bot. I can help you find and understand legal sections and articles."

  utter_ask_incident_type:
    - text: "I can help with that. What is the nature of the incident? (e.g., Theft, Harassment, Accident)"

  utter_ask_incident_details:
    - text: "Please provide a brief description of what happened."

  utter_ask_incident_location:
    - text: "Where did this occur? (Provide a landmark or area)"

  utter_submit_complaint:
    - text: "All set! Your draft is ready. Click the button below to open it in your mail app."



actions:
  - action_get_legal_description
  - action_find_nearby_police
  - action_prepare_complaint
  - validate_complaint_form

forms:
  complaint_form:
    required_slots:
      - incident_type
      - incident_details
      - incident_location

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true