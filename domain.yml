version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - bot_challenge
  - ask_legal_info
  - find_police
  - mood_great
  - mood_unhappy
  - request_complaint

entities:
  - legal_section
  - session_metadata
  - incident_type
  - incident_details
  - incident_location

slots:
  legal_section:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: legal_section

  session_metadata:
    type: any
    mappings:
      - type: from_entity
        entity: session_metadata

  incident_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  incident_details:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  incident_location:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

responses:
  utter_happy:
    - text: "Great, carry on!"

  utter_cheer_up:
    - text: "Here is something to cheer you up:"
      image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
    - text: "Did that help you?"

  utter_greet:
    - text: "Hello! I am NiDi. How can I assist you with legal matters today?"

  utter_ask_legal_section:
    - text: "I've noted you are asking about a legal provision. Let me fetch that for you."

  utter_goodbye:
    - text: "Goodbye! Stay legally informed."

  utter_iamabot:
    - text: "I am NiDi, a legal information bot. I can help you find laws, find police stations, or draft complaints."

actions:
  - action_get_legal_description
  - action_find_nearby_police
  - action_prepare_complaint

session_config:
  session_expiration_time: 5
  carry_over_slots_to_new_session: false