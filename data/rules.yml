version: "3.1"

rules:
  - rule: Activate legal lookup whenever user asks for info
    steps:
      - intent: ask_legal_info
      - action: action_get_legal_description

  - rule: Activate Police Locator
    steps:
      - intent: find_police
      - action: action_find_nearby_police

  - rule: Say goodbye anytime the user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Say 'I am a bot' anytime the user challenges
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Start dynamic legal complaint conversation
    steps:
       - intent: request_complaint
       - action: action_prepare_complaint